<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Test - Nation Coaching</title>

<style>
body{
    font-family: Arial;
    background:#001f3f;
    color:white;
    text-align:center;
    padding:20px;
}

select, button{
    padding:10px;
    font-size:16px;
    margin:10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
}

button{
    background:#ffcc00;
    font-weight:bold;
}

button:hover{
    background:white;
}

.question-box{
    background:#002b5c;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
    text-align:left;
}

.result-box{
    background:#ffcc00;
    color:black;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

.back-btn{
    position:fixed;
    top:15px;
    left:15px;
    background:white;
    color:black;
}
</style>
</head>

<body>

<!-- SOUND EFFECTS -->
<audio id="clickSound" src="click.mp3"></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>

<button class="back-btn" onclick="playClick(); goBack()">⬅ Main Menu</button>

<h2>🎓 Nation Coaching Centre Loha</h2>
<h3>Free Scholarship Test</h3>

<select id="classSelect">
<option value="">-- Class Select Karein --</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
</select>

<br>
<button onclick="playClick(); startTest()">Test Start Karein</button>

<div id="questionsContainer"></div>
<div id="result"></div>

<script>

function playClick(){
    document.getElementById("clickSound").play();
}

function goBack(){
    window.location.href="index.html";
}

var questionBank = {

7: [
{q:"12 × 3 = ?", options:["36","32","30"], answer:0},
{q:"Bharat ki rajdhani kya hai?", options:["Delhi","Mumbai","Kolkata"], answer:0},
{q:"49 ÷ 7 = ?", options:["6","7","8"], answer:1},
{q:"Jal ka rasayanik sutra?", options:["CO2","H2O","O2"], answer:1},
{q:"100 - 45 = ?", options:["55","65","50"], answer:0}
],

8: [
{q:"15% of 200 = ?", options:["20","30","40"], answer:1},
{q:"Pythagoras theorem kis subject se hai?", options:["Maths","SST","Hindi"], answer:0},
{q:"Square of 12?", options:["124","144","134"], answer:1},
{q:"Mughal vansh ka sthapak?", options:["Babur","Akbar","Shahjahan"], answer:0},
{q:"25 × 4 = ?", options:["90","100","80"], answer:1}
],

9: [
{q:"(a+b)² ka formula?", options:["a²+b²","a²+2ab+b²","a²-b²"], answer:1},
{q:"Newton ka first law kis se sambandhit hai?", options:["Gati","Roshni","DhwanI"], answer:0},
{q:"Samvidhan kab lagu hua?", options:["1950","1947","1960"], answer:0},
{q:"36 ka vargmool?", options:["6","8","9"], answer:0},
{q:"Linear equation ka udaharan?", options:["x+2=5","x²+4","x³+2"], answer:0}
],

10: [
{q:"Quadratic equation ka general form?", options:["ax²+bx+c=0","a+b=c","x+y=z"], answer:0},
{q:"Photosynthesis kaha hota hai?", options:["Mitochondria","Chloroplast","Nucleus"], answer:1},
{q:"1857 ki kranti ka netritva kisne kiya?", options:["Rani Laxmi Bai","Gandhi","Nehru"], answer:0},
{q:"sin²θ + cos²θ = ?", options:["0","1","2"], answer:1},
{q:"Speed ka formula?", options:["Distance/Time","Time/Distance","Mass×Speed"], answer:0}
]

};

var selectedQuestions = [];

function shuffleArray(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function startTest(){
    var cls = document.getElementById("classSelect").value;
    var container = document.getElementById("questionsContainer");
    var resultDiv = document.getElementById("result");

    container.innerHTML="";
    resultDiv.innerHTML="";

    if(cls==""){
        alert("Pehle class select karein");
        return;
    }

    selectedQuestions = [...questionBank[cls]];
    shuffleArray(selectedQuestions);

    for(var i=0;i<selectedQuestions.length;i++){
        container.innerHTML += "<div class='question-box'>";
        container.innerHTML += "<p>"+(i+1)+". "+selectedQuestions[i].q+"</p>";

        for(var j=0;j<selectedQuestions[i].options.length;j++){
            container.innerHTML += 
            "<input type='radio' name='q"+i+"' value='"+j+"'> "
            +selectedQuestions[i].options[j]+"<br>";
        }

        container.innerHTML += "</div>";
    }

    container.innerHTML += "<button onclick='playClick(); checkResult()'>Submit Test</button>";
}

function checkResult(){
    var score = 0;

    for(var i=0;i<selectedQuestions.length;i++){
        var options = document.getElementsByName("q"+i);

        for(var j=0;j<options.length;j++){
            if(options[j].checked){
                if(j == selectedQuestions[i].answer){
                    score++;
                }
            }
        }
    }

    var rank="";
    if(score == 5){
        rank="🥇 Gold Rank";
        document.getElementById("correctSound").play();
    }else if(score == 4){
        rank="🥈 Silver Rank";
        document.getElementById("correctSound").play();
    }else if(score == 3){
        rank="🥉 Bronze Rank";
        document.getElementById("correctSound").play();
    }else{
        rank="📚 Practice Needed";
        document.getElementById("wrongSound").play();
    }

    var finalMsg = "<div class='result-box'>";
    finalMsg += "<h3>Aapka Score: "+score+"/"+selectedQuestions.length+"</h3>";
    finalMsg += "<h3>"+rank+"</h3>";

    if(score >= 4){
        finalMsg += "<p>🎉 Aap admission ke liye yogya hain. Sampark karein: 8409457667</p>";
    }else{
        finalMsg += "<p>📖 Aur mehnat karein aur phir se try karein!</p>";
    }

    finalMsg += "</div>";

    document.getElementById("result").innerHTML = finalMsg;
}

</script>

</body>
</html>
